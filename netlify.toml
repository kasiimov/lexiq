[build]
  publish = "."

# ИИ-репетитор: ключи провайдеров живут в переменных окружения сайта,
# в браузер уходит только текст ответа.
[[edge_functions]]
  path = "/api/tutor"
  function = "tutor"

# Генерация урока и теста: ответ приходит цельным JSON, не потоком.
[[edge_functions]]
  path = "/api/generate"
  function = "generate"

# Старый путь к словарю (до переезда в data/) — чтобы не ломать закладки и кэш
[[redirects]]
  from = "/vocabulary.json"
  to = "/data/vocabulary.json"
  status = 301
  force = true

# Старая версия приложения жила по /ang.html
[[redirects]]
  from = "/ang.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/data/vocabulary.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
