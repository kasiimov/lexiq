<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Congix English Admin — Foydalanuvchilar</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/admin.css?v=8">
<link rel="stylesheet" href="assets/css/admin-users.css?v=1">
</head>
<body>

<div class="container">

<header>
  <div class="logo-wrap">
    <div class="logo-box">C</div>
    <div class="logo-text">
      <div class="t1">Congix English Admin</div>
      <div class="t2">Foydalanuvchilar paneli</div>
    </div>
  </div>
  <nav class="admin-tabs">
    <a href="/admin" class="active">Foydalanuvchilar</a>
    <a href="/admin-words.html">Lug'at</a>
  </nav>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="loadUsers()">🔄 Yangilash</button>
    <button class="btn btn-primary" onclick="exportUsersCSV()">💾 CSV eksport</button>
    <a class="btn btn-secondary" href="/admin/logout">🚪 Chiqish</a>
  </div>
</header>

<div class="stats-grid" id="stats-grid"></div>

<div class="controls">
  <div class="search-row">
    <input type="text" class="search-input" id="search-input"
           placeholder="🔍 Ism yoki email bo'yicha qidirish..." oninput="renderUsers()">
  </div>

  <div class="filter-grid">
    <span class="filter-label">Holat</span>
    <div class="filter-pills" id="activity-pills">
      <button class="pill active" data-activity="all" onclick="setActivityFilter('all')">Hammasi</button>
      <button class="pill" data-activity="today" onclick="setActivityFilter('today')">Bugun faol</button>
      <button class="pill" data-activity="week" onclick="setActivityFilter('week')">7 kun ichida</button>
      <button class="pill" data-activity="idle" onclick="setActivityFilter('idle')">Nofaol</button>
      <button class="pill" data-activity="never" onclick="setActivityFilter('never')">Boshlamagan</button>
    </div>

    <span class="filter-label">Kirish usuli</span>
    <div class="filter-controls">
      <select class="filter-select" id="provider-filter" onchange="renderUsers()">
        <option value="all">Hammasi</option>
        <option value="password">Email / parol</option>
        <option value="google">Google</option>
      </select>
    </div>

    <span class="filter-label">Saralash</span>
    <div class="filter-controls">
      <select class="filter-select" id="sort-by" onchange="renderUsers()">
        <option value="recent">So'nggi kirgan</option>
        <option value="new">Yangi ro'yxatdan o'tgan</option>
        <option value="words">Ko'p so'z o'rgangan</option>
        <option value="streak">Uzun streak</option>
        <option value="accuracy">Aniqlik bo'yicha</option>
        <option value="name">Ism (A-Z)</option>
      </select>
    </div>
  </div>
</div>

<div id="users-container"></div>

</div>

<!-- USER DETAIL MODAL -->
<div class="modal-backdrop" id="user-modal">
  <div class="modal">
    <h2 id="user-modal-title">Foydalanuvchi</h2>
    <div id="user-modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeUserModal()">Yopish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/admin-users.js?v=1"></script>

</body>
</html>
