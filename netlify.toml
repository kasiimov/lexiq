[build]
  publish = "."

# ИИ-репетитор: ключи провайдеров живут в переменных окружения сайта,
# в браузер уходит только текст ответа.
[[edge_functions]]
  path = "/api/tutor"
  function = "tutor"

# Генерация урока и теста: ответ приходит цельным JSON, не потоком.
[[edge_functions]]
  path = "/api/generate"
  function = "generate"

# Вход в админку. Пароль сверяется здесь, на сервере, поэтому в браузер он
# не попадает; статический admin.html без валидной куки просто не отдаётся.
[[edge_functions]]
  path = "/admin"
  function = "admin-gate"

[[edge_functions]]
  path = "/admin.html"
  function = "admin-gate"

[[edge_functions]]
  path = "/admin/logout"
  function = "admin-gate"

# Короткий адрес приложения
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 301

# Старая версия приложения жила по /ang.html, а само приложение — на «/»,
# пока его место не занял лендинг.
[[redirects]]
  from = "/ang.html"
  to = "/app.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Шрифты и SDK тянутся с внешних доменов, поэтому список источников явный.
# Firebase нужен для входа, gstatic — сам SDK, googleapis — токены и шрифты.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; worker-src 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; worker-src 'self'; base-uri 'self'; form-action 'self'"

# Имена файлов не содержат хэша, поэтому годовой кэш здесь опасен: браузер
# неделю держал старый app.css, HTML приезжал новый — и интерфейс разъезжался.
# Теперь браузер обязан переспросить; при совпадении ETag ответ 304, это дёшево.
# Офлайн обеспечивает service worker, а не заголовок.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

